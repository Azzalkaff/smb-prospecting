<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SMB Prospecting Engine — Web & Promo Edition</title>
<style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
        --bg: #fafafa;
        --panel: #ffffff;
        --border: #e5e5e5;
        --border-strong: #d4d4d4;
        --text: #171717;
        --text-muted: #737373;
        --text-faint: #a3a3a3;
        --accent: #059669;
        --accent-bg: #ecfdf5;
        --accent-border: #a7f3d0;
    }

    html { -webkit-text-size-adjust: 100%; }

    body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        background: var(--bg);
        color: var(--text);
        font-size: 14px;
        line-height: 1.5;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        -webkit-font-smoothing: antialiased;
    }

    header {
        background: var(--panel);
        border-bottom: 1px solid var(--border);
        position: sticky;
        top: 0;
        z-index: 10;
    }
    .header-inner {
        max-width: 900px;
        margin: 0 auto;
        padding: 0 20px;
        height: 56px;
        display: flex;
        align-items: center;
        justify-content: space-between;
    }
    .brand { display: flex; align-items: center; gap: 10px; }
    .brand-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }
    .brand-name { font-size: 13px; font-weight: 600; letter-spacing: 0.02em; }
    .brand-sub { font-size: 11px; color: var(--text-muted); }
    .header-right { display: flex; align-items: center; gap: 10px; }
    .counter {
        font-size: 11px;
        color: var(--text-muted);
        padding: 4px 10px;
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: 6px;
        font-variant-numeric: tabular-nums;
    }

    button, .btn {
        font-family: inherit;
        font-size: 12px;
        font-weight: 500;
        cursor: pointer;
        border: 1px solid var(--border);
        background: var(--panel);
        color: var(--text);
        padding: 6px 12px;
        border-radius: 6px;
        transition: background 0.1s, border-color 0.1s;
    }
    button:hover, .btn:hover { background: #f5f5f5; border-color: var(--border-strong); }
    button:active { background: #ededed; }
    button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    button.primary:hover { background: #047857; border-color: #047857; }

    main {
        flex: 1;
        max-width: 900px;
        width: 100%;
        margin: 0 auto;
        padding: 32px 20px;
    }

    .card {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 24px;
    }

    .status-bar {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding-bottom: 16px;
        border-bottom: 1px solid var(--border);
    }
    .status-left {
        display: flex;
        align-items: center;
        gap: 12px;
        font-size: 11px;
        color: var(--text-muted);
        text-transform: uppercase;
        letter-spacing: 0.05em;
        font-weight: 600;
    }
    .status-right { display: flex; align-items: center; gap: 6px; }
    .focus-tag {
        font-size: 10px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        padding: 4px 10px;
        background: var(--accent-bg);
        border: 1px solid var(--accent-border);
        color: var(--accent);
        border-radius: 4px;
    }

    .cycle-btn {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 11px;
    }
    .cycle-dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--text-faint);
        transition: background 0.15s;
    }
    .cycle-btn.on .cycle-dot { background: var(--accent); }
    .cycle-btn.on { color: var(--accent); border-color: var(--accent-border); background: var(--accent-bg); }

    .arrow-group {
        display: flex;
        border: 1px solid var(--border);
        border-radius: 6px;
        overflow: hidden;
        background: var(--panel);
    }
    .arrow-group button {
        border: none;
        border-radius: 0;
        padding: 6px 10px;
        background: transparent;
        font-size: 14px;
        line-height: 1;
        color: var(--text-muted);
    }
    .arrow-group button:first-child { border-right: 1px solid var(--border); }
    .arrow-group button:hover { background: #f5f5f5; color: var(--text); }

    .reels {
        display: grid;
        grid-template-columns: 1fr;
        gap: 10px;
        padding: 20px 0;
    }
    @media (min-width: 720px) {
        .reels { grid-template-columns: 4fr 3fr 5fr; }
    }

    .reel-col {
        position: relative;
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 12px;
        cursor: pointer;
        transition: border-color 0.15s, background 0.15s;
        overflow: hidden;
    }
    .reel-col:hover { border-color: var(--border-strong); }
    .reel-col.active { border-color: var(--accent); background: var(--accent-bg); }

    .reel-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding-bottom: 8px;
        margin-bottom: 4px;
        border-bottom: 1px solid var(--border);
    }
    .reel-col.active .reel-head { border-bottom-color: var(--accent-border); }

    .reel-label {
        font-size: 10px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: var(--text-muted);
        display: flex;
        align-items: center;
        gap: 6px;
    }
    .reel-col.active .reel-label { color: var(--accent); }

    .reel-key {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 16px;
        height: 16px;
        font-size: 9px;
        font-weight: 700;
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: 3px;
        color: var(--text-muted);
    }
    .reel-col.active .reel-key {
        background: #fff;
        border-color: var(--accent-border);
        color: var(--accent);
    }

    .reel-index {
        font-size: 10px;
        font-weight: 600;
        color: var(--text-faint);
        font-variant-numeric: tabular-nums;
    }
    .reel-col.active .reel-index { color: var(--accent); }

    .reel-viewport {
        position: relative;
        overflow: hidden;
        height: 70px;
        -webkit-mask-image: linear-gradient(to bottom, transparent 0%, #000 20%, #000 80%, transparent 100%);
                mask-image: linear-gradient(to bottom, transparent 0%, #000 20%, #000 80%, transparent 100%);
    }
    @media (min-width: 720px) { .reel-viewport { height: 90px; } }

    .reel-track {
        transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1);
        will-change: transform;
    }

    .reel-item {
        display: flex;
        align-items: center;
        justify-content: center;
        height: 70px;
        padding: 0 8px;
        overflow: hidden;
    }
    @media (min-width: 720px) { .reel-item { height: 90px; } }

    .reel-item .txt {
        font-weight: 600;
        letter-spacing: -0.01em;
        text-align: center;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        max-width: 100%;
        color: var(--text-faint);
        transition: color 0.2s;
    }
    .reel-item.active .txt { color: var(--text); }
    .reel-col#col-country .reel-item.active .txt { color: var(--accent); }

    #col-niche .txt { font-size: 15px; }
    #col-country .txt { font-size: 14px; }
    #col-sublocation .txt { font-size: 16px; font-weight: 700; }

    @media (min-width: 720px) {
        #col-niche .txt { font-size: 18px; }
        #col-country .txt { font-size: 16px; }
        #col-sublocation .txt { font-size: 20px; }
    }

    .reel-num {
        font-size: 10px;
        font-weight: 400;
        color: var(--accent);
        margin-right: 6px;
        font-variant-numeric: tabular-nums;
    }

    .bottom-bar {
        padding-top: 16px;
        border-top: 1px solid var(--border);
        display: flex;
        flex-direction: column;
        gap: 12px;
    }
    @media (min-width: 720px) {
        .bottom-bar { flex-direction: row; align-items: center; justify-content: space-between; }
    }

    .shortcuts {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        font-size: 10px;
        color: var(--text-muted);
    }
    .shortcuts span { display: inline-flex; align-items: center; gap: 3px; }
    .shortcuts .label {
        color: var(--accent);
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.05em;
    }
    kbd {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 16px;
        height: 16px;
        padding: 0 4px;
        font-size: 9px;
        font-family: inherit;
        font-weight: 600;
        background: var(--bg);
        border: 1px solid var(--border);
        border-bottom-width: 2px;
        border-radius: 3px;
        color: var(--text-muted);
    }

    .actions {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px;
    }

    .clipboard-pill {
        font-size: 11px;
        font-weight: 600;
        color: var(--accent);
        background: var(--accent-bg);
        border: 1px solid var(--accent-border);
        padding: 6px 10px;
        border-radius: 6px;
        max-width: 200px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        font-variant-numeric: tabular-nums;
    }

    .toast {
        position: fixed;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%) translateY(10px);
        background: #171717;
        color: #fff;
        font-size: 12px;
        font-weight: 500;
        padding: 10px 16px;
        border-radius: 8px;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.2s, transform 0.2s;
        z-index: 100;
        max-width: 90vw;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    button:focus-visible, .reel-col:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 1px;
    }
</style>
</head>
<body>

<header>
    <div class="header-inner">
        <div class="brand">
            <div class="brand-dot"></div>
            <div>
                <div class="brand-name">SMB Prospector</div>
                <div class="brand-sub">Web &amp; Promo · GBP · WhatsApp Markets</div>
            </div>
        </div>
        <div class="header-right">
            <span class="counter" id="counter">0 AREAS</span>
            <button id="btn-reset" type="button">Reset</button>
        </div>
    </div>
</header>

<main>
    <div class="card">

        <div class="status-bar">
            <div class="status-left">
                <span>Controller</span>
                <span class="focus-tag" id="focus-tag">Suburb / Area</span>
            </div>
            <div class="status-right">
                <button id="btn-cycle" class="cycle-btn" type="button" title="Auto-cycle [A]">
                    <span class="cycle-dot"></span>
                    <span id="cycle-label">Auto</span>
                    <kbd>A</kbd>
                </button>
                <div class="arrow-group">
                    <button id="btn-prev" type="button" title="Previous [W / ↑]">↑</button>
                    <button id="btn-next" type="button" title="Next [S / ↓]">↓</button>
                </div>
            </div>
        </div>

        <div class="reels">
            <div class="reel-col" id="col-niche" tabindex="0">
                <div class="reel-head">
                    <div class="reel-label"><span class="reel-key">1</span> Target Niche</div>
                    <span class="reel-index" id="idx-niche">01 / 00</span>
                </div>
                <div class="reel-viewport">
                    <div class="reel-track" id="track-niche"></div>
                </div>
            </div>

            <div class="reel-col" id="col-country" tabindex="0">
                <div class="reel-head">
                    <div class="reel-label"><span class="reel-key">2</span> Country</div>
                    <span class="reel-index" id="idx-country">01 / 00</span>
                </div>
                <div class="reel-viewport">
                    <div class="reel-track" id="track-country"></div>
                </div>
            </div>

            <div class="reel-col active" id="col-sublocation" tabindex="0">
                <div class="reel-head">
                    <div class="reel-label"><span class="reel-key">3</span> Suburb / Area</div>
                    <span class="reel-index" id="idx-sublocation">01 / 00</span>
                </div>
                <div class="reel-viewport">
                    <div class="reel-track" id="track-sublocation"></div>
                </div>
            </div>
        </div>

        <div class="bottom-bar">
            <div class="shortcuts">
                <span class="label">Shortcuts</span>
                <span><kbd>↑</kbd><kbd>↓</kbd> Slide</span>
                <span><kbd>←</kbd><kbd>→</kbd> Switch</span>
                <span><kbd>1</kbd><kbd>2</kbd><kbd>3</kbd> Jump</span>
                <span><kbd>C</kbd> Copy</span>
                <span><kbd>⏎</kbd> Maps</span>
            </div>
            <div class="actions">
                <code class="clipboard-pill" id="active-query">—</code>
                <button id="btn-copy" type="button">Copy</button>
                <button id="btn-maps" class="primary" type="button">Open Maps</button>
            </div>
        </div>

    </div>
</main>

<div class="toast" id="toast">Copied</div>

        var ta = document.createElement('textarea');
        ta.value = text;
        ta.style.position = 'fixed';
        ta.style.left = '-9999px';
        document.body.appendChild(ta);
        ta.select();
        var ok = false;
        try { ok = document.execCommand('copy'); } catch (e) {}
        document.body.removeChild(ta);
        return ok;
    }

    function pad(n) { return n < 10 ? '0' + n : '' + n; }
    function countryKey() { return COUNTRY_KEYS[S.countryIdx]; }
    function countryName() { return DB[countryKey()].name.split('(')[0].trim(); }
    function niche() { return NICHES[S.nicheIdx]; }
    function itemHeight() { return window.innerWidth >= 720 ? 90 : 70; }

    function escapeHtml(s) {
        return String(s).replace(/[&<>"']/g, function (c) {
            return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
        });
    }

    /* ── Reel rendering ── */
    function buildReel(track, items, activeIdx, renderFn) {
        track.innerHTML = '';
        var frag = document.createDocumentFragment();
        for (var i = 0; i < items.length; i++) {
            var div = document.createElement('div');
            div.className = 'reel-item' + (i === activeIdx ? ' active' : '');
            div.innerHTML = renderFn(items[i], i);
            frag.appendChild(div);
        }
        track.appendChild(frag);
        track.style.transform = 'translateY(-' + (activeIdx * itemHeight()) + 'px)';
    }

    function renderNiche() {
        buildReel(el.trackNiche, NICHES, S.nicheIdx, function (n) {
            return '<span class="txt">' + escapeHtml(n) + '</span>';
        });
        el.idxNiche.textContent = pad(S.nicheIdx + 1) + ' / ' + NICHES.length;
    }

    function renderCountry() {
        var names = COUNTRY_KEYS.map(function (k) { return DB[k].name.split('(')[0].trim(); });
        buildReel(el.trackCountry, names, S.countryIdx, function (n) {
            return '<span class="txt">' + escapeHtml(n) + '</span>';
        });
        el.idxCountry.textContent = pad(S.countryIdx + 1) + ' / ' + COUNTRY_KEYS.length;
    }

    function renderSub() {
        var cities = S.selected;
        el.counter.textContent = cities.length + (cities.length === 1 ? ' AREA' : ' AREAS');

        if (cities.length === 0) {
            el.trackSub.innerHTML = '<div class="reel-item active"><span class="txt" style="color:var(--text-faint)">No Areas</span></div>';
            el.trackSub.style.transform = 'translateY(0)';
            el.idxSub.textContent = '00 / 00';
            el.queryPill.textContent = 'None';
            el.btnMaps.disabled = true;
            return;
        }

        el.btnMaps.disabled = false;

        if (S.subIdx >= cities.length) S.subIdx = 0;
        if (S.subIdx < 0) S.subIdx = cities.length - 1;

        buildReel(el.trackSub, cities, S.subIdx, function (c, i) {
            var num = pad(i + 1);
            return '<span class="txt"><span class="reel-num">' + num + '</span>' + escapeHtml(c) + '</span>';
        });
        el.idxSub.textContent = pad(S.subIdx + 1) + ' / ' + cities.length;

        var active = cities[S.subIdx];
        var fullQuery = niche() + ' ' + active + ' ' + countryName();
        el.queryPill.textContent = active;
        el.queryPill.title = fullQuery;
        el.btnMaps.onclick = function () {
            window.open('https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(fullQuery), '_blank');
        };
    }

    /* ── Column focus ── */
    function updateFocus() {
        el.colNiche.classList.toggle('active', S.focus === 'niche');
        el.colCountry.classList.toggle('active', S.focus === 'country');
        el.colSub.classList.toggle('active', S.focus === 'sublocation');
        el.focusTag.textContent = S.focus === 'niche' ? 'Niche' :
                                  S.focus === 'country' ? 'Country' : 'Suburb / Area';
    }

    function setFocus(name) {
        S.focus = name;
        updateFocus();
    }

    function switchFocus(dir) {
        var order = ['niche', 'country', 'sublocation'];
        var i = order.indexOf(S.focus);
        i = (i + dir + order.length) % order.length;
        setFocus(order[i]);
    }

    /* ── Slide ── */
    function slide(dir) {
        if (S.focus === 'niche') {
            S.nicheIdx = (S.nicheIdx + dir + NICHES.length) % NICHES.length;
            renderNiche();
            renderSub();
        } else if (S.focus === 'country') {
            S.countryIdx = (S.countryIdx + dir + COUNTRY_KEYS.length) % COUNTRY_KEYS.length;
            onCountryChange(false);
        } else {
            if (S.selected.length <= 1) return;
            S.subIdx = (S.subIdx + dir + S.selected.length) % S.selected.length;
            renderSub();
        }
    }

    /* ── Country change ── */
    function onCountryChange(resetNiche) {
        var data = DB[countryKey()];
        S.selected = [];
        var picked = 0;
        for (var i = 0; i < data.cities.length && picked < 8; i++) {
            if (data.cities[i][1] === 1) {
                S.selected.push(data.cities[i][0]);
                picked++;
            }
        }
        if (resetNiche && data.defaultNiche) {
            var idx = NICHES.indexOf(data.defaultNiche);
            if (idx !== -1) S.nicheIdx = idx;
        }
        S.subIdx = 0;
        renderCountry();
        renderNiche();
        renderSub();
        toast('Switched to ' + data.name);
    }

    /* ── Copy active ── */
    function copyActive() {
        if (S.selected.length === 0) return;
        var active = S.selected[S.subIdx];
        var payload = niche() + ' ' + active + ' ' + countryName();
        if (copy(payload)) {
            el.btnCopy.textContent = 'Copied!';
            toast('Copied: ' + payload);
            setTimeout(function () { el.btnCopy.textContent = 'Copy'; }, 1400);
        }
    }

    /* ── Auto cycle ── */
    function toggleCycle() {
        S.cycling = !S.cycling;
        if (S.cycling) {
            el.btnCycle.classList.add('on');
            el.cycleLabel.textContent = 'On';
            S.timer = setInterval(function () { slide(1); }, 3000);
            toast('Auto cycle on');
        } else {
            el.btnCycle.classList.remove('on');
            el.cycleLabel.textContent = 'Auto';
            if (S.timer) { clearInterval(S.timer); S.timer = null; }
            toast('Auto cycle off');
        }
    }

    /* ── Reset ── */
    function resetAll() {
        S.nicheIdx = 0;
        S.countryIdx = 0;
        S.subIdx = 0;
        S.focus = 'sublocation';
        if (S.cycling) toggleCycle();
        updateFocus();
        onCountryChange(true);
        toast('Workspace reset');
    }

    /* ── Events ── */
    function bindColumn(colEl, name) {
        colEl.addEventListener('click', function () { setFocus(name); });
        colEl.addEventListener('wheel', function (e) {
            e.preventDefault();
            setFocus(name);
            slide(e.deltaY > 0 ? 1 : -1);
        }, { passive: false });
    }

    bindColumn(el.colNiche, 'niche');
    bindColumn(el.colCountry, 'country');
    bindColumn(el.colSub, 'sublocation');

    el.btnNext.addEventListener('click', function () { slide(1); });
    el.btnPrev.addEventListener('click', function () { slide(-1); });
    el.btnCopy.addEventListener('click', copyActive);
    el.btnCycle.addEventListener('click', toggleCycle);
    el.btnReset.addEventListener('click', resetAll);

    document.addEventListener('keydown', function (e) {
        var tag = (e.target.tagName || '').toUpperCase();
        if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return;

        switch (e.key) {
            case 'ArrowDown': case 's': case 'S':
                e.preventDefault(); slide(1); break;
            case 'ArrowUp': case 'w': case 'W':
                e.preventDefault(); slide(-1); break;
            case 'ArrowRight': case 'Tab':
                e.preventDefault(); switchFocus(1); break;
            case 'ArrowLeft':
                e.preventDefault(); switchFocus(-1); break;
            case '1': e.preventDefault(); setFocus('niche'); break;
            case '2': e.preventDefault(); setFocus('country'); break;
            case '3': e.preventDefault(); setFocus('sublocation'); break;
            case 'c': case 'C': case ' ':
                e.preventDefault(); copyActive(); break;
            case 'Enter':
                e.preventDefault();
                if (S.selected.length > 0 && el.btnMaps.onclick) el.btnMaps.onclick();
                break;
            case 'a': case 'A':
                e.preventDefault(); toggleCycle(); break;
        }
    });

    var resizeTimer = null;
    window.addEventListener('resize', function () {
        if (resizeTimer) clearTimeout(resizeTimer);
        resizeTimer = setTimeout(function () {
            renderNiche(); renderCountry(); renderSub();
        }, 120);
    });

    /* ── Boot ── */
    updateFocus();
    onCountryChange(true);

})();
</script>
</body>
</html>
